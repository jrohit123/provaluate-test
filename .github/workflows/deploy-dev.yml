name: Deploy React Dev to GitHub Pages

on:
  push:
    branches: [dev]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create .env.testing
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.testing
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.testing
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env.testing
          echo "VITE_PYTHON_URL=${{ secrets.VITE_PYTHON_URL }}" >> .env.testing
          echo "VITE_OPENAI_API_KEY=${{ secrets.VITE_OPENAI_API_KEY }}" >> .env.testing
          echo "VITE_DEEPGRAM_API_KEY=${{ secrets.VITE_DEEPGRAM_API_KEY }}" >> .env.testing
          echo "VITE_ASSEMBLYAI_API_KEY=${{ secrets.VITE_ASSEMBLYAI_API_KEY }}" >> .env.testing

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:testing
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: GitHub Pages SPA fallback and Jekyll bypass
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4