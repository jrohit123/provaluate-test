<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProValuate - Assess Resumes</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Segoe UI, Tahoma, sans-serif; margin: 12px; font-size: 14px; }
    h2 { margin: 0 0 12px 0; font-size: 16px; }
    label { display: block; margin-top: 10px; margin-bottom: 4px; font-weight: 600; }
    select { width: 100%; padding: 6px 8px; margin-bottom: 8px; }
    button { margin-top: 12px; padding: 8px 16px; background: #0078d4; color: white; border: none; cursor: pointer; font-size: 14px; }
    button:hover { background: #106ebe; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 12px; padding: 8px; background: #f5f5f5; border-radius: 4px; min-height: 40px; font-size: 13px; white-space: pre-wrap; }
    #status.error { background: #fde; color: #c00; }
    #status.success { background: #dfd; color: #060; }
    .link { color: #0078d4; text-decoration: none; }
    .link:hover { text-decoration: underline; }
    .settings-link { margin-top: 16px; font-size: 12px; }
  </style>
</head>
<body>
  <h2>ProValuate</h2>
  <p>Assess resume attachments in this email against a job description.</p>
  <label for="jd">Job description</label>
  <select id="jd">
    <option value="">-- Select JD --</option>
  </select>
  <label for="criteria">Criteria</label>
  <select id="criteria">
    <option value="">-- Select criteria --</option>
  </select>
  <button id="assess" disabled>Assess resumes</button>
  <div id="status"></div>
  <p class="settings-link"><a href="settings.html" target="_blank" class="link">Settings</a> (API URL, Company ID, User ID)</p>
  <script type="text/javascript" src="taskpane.js"></script>
</body>
</html>
