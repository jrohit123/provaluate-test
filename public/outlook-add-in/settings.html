<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProValuate Add-in Settings</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Segoe UI, Tahoma, sans-serif; margin: 16px; max-width: 480px; }
    h2 { font-size: 18px; margin-bottom: 12px; }
    label { display: block; margin-top: 12px; margin-bottom: 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; margin-bottom: 8px; }
    button { margin-top: 16px; padding: 8px 20px; background: #0078d4; color: white; border: none; cursor: pointer; }
    button:hover { background: #106ebe; }
    .hint { font-size: 12px; color: #666; margin-top: 2px; }
    #saved { margin-top: 12px; color: #060; font-size: 13px; }
  </style>
</head>
<body>
  <h2>ProValuate Outlook Add-in Settings</h2>
  <p>Enter your backend API URL and ProValuate account details. These are stored in your browser only.</p>
  <label for="api_base">API base URL</label>
  <input type="text" id="api_base" placeholder="https://devprovaluate_py.aitamate.com">
  <span class="hint">Backend that serves /api/outlook/register and /api/outlook/fetch-and-analyze</span>
  <label for="company_id">Company ID</label>
  <input type="text" id="company_id" placeholder="UUID from ProValuate dashboard">
  <label for="user_id">User ID</label>
  <input type="text" id="user_id" placeholder="UUID from ProValuate dashboard">
  <button id="save">Save</button>
  <div id="saved"></div>
  <script type="text/javascript" src="settings.js"></script>
</body>
</html>
