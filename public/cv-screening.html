<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provaluate AI - Live Workflow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"DM Sans"', 'sans-serif'],
                        mono: ['"DM Mono"', 'monospace'],
                    },
                    colors: {
                        primary: {
                            light: '#e6f1fb',
                            DEFAULT: '#094D7B',
                            dark: '#06385a'
                        },
                        accent: {
                            light: '#EAF3DE',
                            DEFAULT: '#3B6D11',
                        },
                        warning: {
                            light: '#FAEEDA',
                            DEFAULT: '#BA7517',
                        },
                        danger: {
                            light: '#FCEBEB',
                            DEFAULT: '#A32D2D',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #F0F4F8; overflow: auto; margin: 0; padding: 0; } 
        
        /* Step Nav Transitions */
        .step-tab { transition: all 0.2s ease; }
        .step-num { transition: all 0.3s ease; }
        
        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse-opacity {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        @keyframes shimmer {
            from { transform: translateX(-100%); }
            to { transform: translateX(200%); }
        }
        @keyframes spin-slow {
            to { transform: rotate(360deg); }
        }

        .animate-fade-up { animation: fadeUp 0.4s ease forwards; }
        .pulse-dot { animation: pulse-opacity 1s infinite; }
        .btn-shimmer {
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
            transform: translateX(-100%);
        }
        .btn-shimmer.running { animation: shimmer 1.5s infinite; }
        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin-slow 0.7s linear infinite;
        }

        /* JD Scanner */
        .raw-line { padding: 1px 0; border-radius: 2px; transition: background 0.15s; display: block; }
        .raw-line.scanning { background: rgba(9,77,123,0.12); color: #094D7B; }

        /* Resolved Cards */
        .resolved-attr {
            opacity: 0; transform: translateY(8px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .resolved-attr.visible { opacity: 1; transform: translateY(0); }
        
        /* Mini Progress Bars */
        .auto-fill { transition: width linear; }
        .score-fill { transition: width 1s ease 0.2s; }

        /* Candidate Cards */
        .candidate-card {
            opacity: 0; transform: translateY(10px);
            transition: all 0.25s ease;
        }
        .candidate-card.visible { opacity: 1; transform: translateY(0); }
        .candidate-card:hover { transform: translateY(-2px); border-color: #094D7B; }

        /* Modal */
        .modal-overlay {
            opacity: 0; pointer-events: none; transition: opacity 0.25s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-content {
            transform: translateY(16px) scale(0.98); transition: transform 0.3s ease;
        }
        .modal-overlay.open .modal-content { transform: translateY(0) scale(1); }

        /* App Fade */
        #app-container { transition: opacity 0.2s ease; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* ===== MOBILE RESPONSIVE ===== */
        @media (max-width: 767px) {
            body { overflow: auto !important; }
            #app-container { overflow: auto !important; height: auto; }
            .step-section { height: auto !important; flex: none !important; overflow: auto; }

            /* Step 1: each panel fills full screen, shown one at a time */
            #step1Grid { display: flex !important; flex-direction: column; flex: 1; min-height: 0; }
            #rawPanel  { flex: 1; min-height: 0; border-right: none !important; border-bottom: 1px solid #e5e7eb; }
            #resolvedPanel { flex: 1; min-height: 0; }

            /* Step 2: table adapts to mobile width */
            #step2TableWrap { overflow-x: visible; }
            #step2TableWrap table { min-width: auto; }
            #step1Footer { display: none !important; }

            /* Step 3: each panel fills full screen, shown one at a time */
            #step3Grid { display: flex !important; flex-direction: column; flex: 1; min-height: 0; }
            #uploadPanel    { flex: 1; min-height: 0; border-right: none !important; border-bottom: 1px solid #e5e7eb; }
            #step3RightPanel { flex: 1; min-height: 0; }

            /* Mobile visibility utility */
            .mobile-hidden { display: none !important; }
            
            /* ADD this — the scorecard panel should scroll, not clip */
            #scorecardPanel {
                overflow-y: auto !important;
                height: auto !important;
                min-height: 0;
                max-height: none !important;
            }
            #step3RightPanel {
                height: auto !important;
                overflow-y: auto !important;
            }
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col h-screen w-screen bg-white">

    <!-- Main Workspace (Strictly edge-to-edge, no headers, no padding) -->
    <main id="app-container" class="w-full h-full flex flex-col min-h-0 overflow-hidden relative opacity-100 p-0 m-0">

        <!-- ================= STEP 1: JD Processing ================= -->
        <section class="step-section flex-col flex-1 min-h-0 animate-fade-up hidden p-0 m-0" id="step1">
            <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-0 min-h-0" id="step1Grid">
                <!-- Raw JD -->
                <div id="rawPanel" class="bg-white border-r border-gray-200 flex flex-col md:h-full rounded-none">
                    <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 shrink-0">
                        <div class="text-[12px] font-semibold text-primary flex items-center gap-2">
                            <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Raw Job Description
                        </div>
                    </div>
                    <div id="rawScrollContainer" class="p-4 relative overflow-y-auto flex-1 font-mono text-[11px] leading-[1.8] text-gray-700 scroll-smooth">
                        <div id="rawText"></div>
                    </div>
                </div>

                <!-- Resolved Attributes -->
                <div id="resolvedPanel" class="bg-white flex flex-col md:h-full rounded-none">
                    <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 shrink-0">
                        <div class="text-[12px] font-semibold text-primary flex items-center gap-2">
                            <i data-lucide="list-checks" class="w-3.5 h-3.5"></i> Resolved Attributes
                        </div>
                    </div>
                    <div class="p-4 overflow-y-auto flex-1 bg-gray-50/30">
                        <div class="flex flex-col gap-2.5" id="resolvedList"></div>
                    </div>
                </div>
            </div>

            <!-- Footer for Green Message -->
            <div class="hidden md:flex h-[52px] bg-white border-t border-gray-100 items-center px-4 shrink-0" id="step1Footer">
            </div>
        </section>

        <!-- ================= STEP 2: Criteria Generation ================= -->
        <section class="step-section flex-col flex-1 min-h-0 animate-fade-up hidden p-0 m-0" id="step2">
            <div class="bg-white flex flex-col flex-1 min-h-0 h-full rounded-none">
                <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 shrink-0">
                    <div class="text-[12px] font-semibold text-primary flex items-center gap-2">
                        <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Senior ML Engineer — AI Criteria
                    </div>
                    <div class="flex items-center gap-3">
                        <button class="flex items-center gap-1.5 border border-primary bg-primary-light text-primary px-2.5 py-0.5 rounded-full text-[10.5px] font-medium" id="genBtn">
                            <i data-lucide="sparkles" class="w-3 h-3"></i> Generate from JD
                        </button>
                    </div>
                </div>
                
                <!-- Table & Weightage Area -->
                <div id="step2TableWrap" class="flex-1 overflow-y-auto overflow-x-auto flex flex-col bg-white">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-primary-light/95 backdrop-blur z-10 border-b border-gray-200">
                            <tr class="text-[10.5px] font-semibold text-primary uppercase tracking-wide">
                                <th class="py-2.5 px-4 w-[28%]">Parameter to Assess</th>
                                <th class="py-2.5 px-4 w-[12%] text-center">Weightage</th>
                                <th class="py-2.5 px-4">How to Assess (Prompt to AI)</th>
                            </tr>
                        </thead>
                        <tbody id="criteriaBody" class="divide-y divide-gray-100"></tbody>
                    </table>
                    
                    <!-- Total Weightage explicitly right under the table -->
                    <div class="px-4 py-3 border-t border-gray-100 flex justify-end bg-gray-50/50 mt-auto shrink-0">
                        <span class="text-[11.5px] text-gray-500">Total Weightage: <strong class="text-primary text-[13px]" id="totalWeight">0%</strong></span>
                    </div>
                </div>

                <!-- Footer (Reserved entirely for Save Button / Green Message) -->
                <div class="h-[52px] bg-white border-t border-gray-100 flex items-center justify-end px-4 shrink-0">
                    <button id="saveBtn" class="px-4 py-1.5 bg-primary text-white rounded-md font-semibold text-[12px] flex items-center gap-1.5 opacity-50 transition-all" disabled>
                        <i data-lucide="save" class="w-3.5 h-3.5"></i> Save Criteria
                    </button>

                </div>
            </div>
        </section>

        <!-- ================= STEP 3: Resume Upload ================= -->
        <section class="step-section flex-col flex-1 min-h-0 animate-fade-up hidden p-0 m-0" id="step3">
            <div class="grid grid-cols-12 gap-0 flex-1 min-h-0 md:h-full" id="step3Grid">
                <!-- Left: Upload Panel -->
                <div id="uploadPanel" class="col-span-12 md:col-span-4 flex flex-col border-r border-gray-200 bg-white">
                    
                    <!-- Session Setup -->
                    <div class="p-4 shrink-0 border-b border-gray-100">
                        <h3 class="text-[12px] font-semibold text-primary mb-3 pb-1.5">Session Setup</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="text-[10px] font-medium text-gray-400 block mb-1">Job Description</label>
                                <div class="border border-gray-200 rounded-md p-2 text-[12px] text-gray-400 flex justify-between items-center transition-all bg-white" id="jdSelect">
                                    <span id="jdSelectText" class="truncate">Select job description...</span>
                                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 opacity-40 shrink-0"></i>
                                </div>
                            </div>
                            <div>
                                <label class="text-[10px] font-medium text-gray-400 block mb-1">Evaluation Criteria</label>
                                <div class="border border-gray-200 rounded-md p-2 text-[12px] text-gray-400 flex justify-between items-center transition-all bg-white" id="criteriaSelect">
                                    <span id="criteriaSelectText" class="truncate">Select criteria...</span>
                                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 opacity-40 shrink-0"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Upload Box -->
                    <div class="flex flex-col flex-1 min-h-0">
                        <div class="px-4 py-2.5 border-b border-gray-100 flex justify-between items-center shrink-0 bg-gray-50/50">
                            <h3 class="text-[12px] font-semibold text-primary">Upload CVs</h3>
                        </div>
                        <div class="p-4 flex-1 flex flex-col min-h-0">
                            <div class="border-2 border-dashed border-gray-200 rounded-lg p-4 text-center transition-all bg-gray-50 flex flex-col items-center justify-center mb-3 shrink-0" id="uploadZone">
                                <i data-lucide="upload-cloud" class="w-6 h-6 text-gray-300 mb-1.5"></i>
                                <div class="text-[12px] text-gray-400">Drop CVs here or click</div>
                            </div>

                            <div class="flex flex-col gap-1.5 mb-4 min-h-[80px] md:flex-1 overflow-y-auto pr-1" id="fileList"></div>

                            <button class="w-full bg-primary text-white py-2.5 rounded-md font-semibold text-[13px] flex items-center justify-center gap-2 relative overflow-hidden transition-all opacity-50 shrink-0" id="provaluateBtn" disabled>
                                <i data-lucide="play-circle" class="w-4 h-4"></i> Pro-Valuate
                                <div class="btn-shimmer" id="btnShimmer"></div>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Right: Candidate Pool / Scorecard -->
                <div id="step3RightPanel" class="col-span-12 md:col-span-8 bg-gray-50/30 flex flex-col min-h-0 relative md:h-full">

                    <!-- Pool View -->
                    <div id="poolView" class="flex flex-col flex-1 min-h-0 p-4 md:p-5">
                        <div class="flex-1 overflow-y-auto pr-2 grid grid-cols-2 gap-3 pb-2 content-start mt-2" id="candidatePool"></div>
                    </div>

                    <!-- Inline Scorecard (hidden initially) -->
                    <div id="scorecardPanel" class="hidden flex-col flex-1 md:h-full overflow-hidden animate-fade-up"></div>

                </div>
            </div>
        </section>

    </main>

    <!-- Modal Overlay -->
    <div class="modal-overlay fixed inset-0 bg-slate-900/50 z-[100] flex items-center justify-center p-4 md:p-6 backdrop-blur-sm" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-content bg-white w-full max-w-5xl rounded-2xl shadow-2xl flex flex-col overflow-hidden" style="max-height: 85vh;" id="modal">
            <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-start shrink-0 bg-gray-50/80" id="modalHeader"></div>
            <div class="p-5 overflow-y-auto flex-1 bg-white" id="modalBody"></div>
        </div>
    </div>

    <script>
        // Utility for robust delays in async functions
        const delay = ms => new Promise(res => setTimeout(res, ms));
        const isMobile = () => window.innerWidth < 768;

        lucide.createIcons();

        // --- DATA DEFINITIONS ---

        const RAW_JD = `Senior Machine Learning Engineer

        const RESOLVED_ATTRS = [
            { key: 'Role Details', icon: 'briefcase', content: `<span class="inline-block bg-white border border-gray-200 px-2 py-0.5 rounded text-[10px] text-gray-700 mr-1 mb-1 shadow-sm">Senior Machine Learning Engineer</span> <span class="inline-block bg-white border border-gray-200 px-2 py-0.5 rounded text-[10px] text-gray-700 mr-1 mb-1 shadow-sm">Full time</span>` },
            { key: 'Location', icon: 'map-pin', content: `<span class="inline-block bg-white border border-gray-200 px-2 py-0.5 rounded text-[10px] text-gray-700 mr-1 mb-1 shadow-sm">San Francisco, CA (Hybrid)</span>` },
            { key: 'Job History', icon: 'clock', content: `<span class="inline-block bg-white border border-gray-200 px-2 py-0.5 rounded text-[10px] text-gray-700 mr-1 mb-1 shadow-sm">4+ years experience in applied ML and MLOps</span>` },
            { key: 'Technical Skills', icon: 'code', content: ['Python', 'PyTorch', 'CUDA', 'TensorRT', 'ONNX', 'AWS/GCP', 'Docker', 'Kubernetes'].map(s => `<span class="inline-block bg-primary-light border border-primary/20 text-primary px-2 py-0.5 rounded text-[10px] mr-1 mb-1">${s}</span>`).join('') },
            { key: 'Functional Skills', icon: 'wrench', content: ['Model Development', 'Data Pipeline Architecture', 'Production Scaling', 'Drift Detection', 'NLP', 'Computer Vision'].map(s => `<span class="inline-block bg-accent-light border border-accent/20 text-accent px-2 py-0.5 rounded text-[10px] mr-1 mb-1">${s}</span>`).join('') },
            { key: 'Soft Skills', icon: 'brain', content: ['Cross-functional Collaboration', 'Excellent communication', 'Explain complex ML'].map(s => `<span class="inline-block bg-white border border-gray-200 text-gray-700 px-2 py-0.5 rounded text-[10px] mr-1 mb-1 shadow-sm">${s}</span>`).join('') },
            { key: 'Educational Qualification', icon: 'graduation-cap', content: `<span class="inline-block bg-accent-light border border-accent/20 text-accent px-2 py-0.5 rounded text-[10px] mr-1 mb-1">Master's or Ph.D. in Computer Science or AI</span>` }
        ];

        const CRITERIA_DATA = [
            { param: 'Deep Learning & Modeling Expertise', weight: 35, note: "Evaluate hands-on experience with PyTorch, CUDA, NLP, and Computer Vision models." },
            { param: 'MLOps & Production Scaling', weight: 25, note: "Assess ability to deploy models using TensorRT, ONNX, Kubernetes, and cloud platforms." },
            { param: 'Data Engineering & Pipelines', weight: 15, note: "Review experience building scalable Python pipelines for large datasets." },
            { param: 'Education & Theoretical Foundation', weight: 10, note: "Verify Master's/Ph.D. credentials and statistical knowledge." },
            { param: 'Communication & Collaboration', weight: 15, note: "Analyze ability to work with medical teams and explain ML decisions." }
        ];

        const CANDIDATES = [
            {
                id: 'aisha', name: 'Aisha Patel', email: 'aisha.patel@email.com', city: 'San Francisco, CA', file: 'Aisha_Patel_CV.pdf', finalScore: 92.5, rec: 'To Be Interviewed', avatarBg: '#EAF3DE', avatarColor: '#3B6D11',
                scores: [
                    { param: 'DL & Modeling Expertise', weight: 35, score: 9.5, rating: 3.32, evidence: '5 years deploying PyTorch vision models. Strong CUDA background.' },
                    { param: 'MLOps & Scaling', weight: 25, score: 9.0, rating: 2.25, evidence: 'Led K8s migration for ML inference at previous startup. Expert in TensorRT.' },
                    { param: 'Data Engineering', weight: 15, score: 8.5, rating: 1.27, evidence: 'Built petabyte-scale ingestion pipelines using AWS and Python.' },
                    { param: 'Education', weight: 10, score: 10.0, rating: 1.0, evidence: 'Ph.D. in Computer Science from Stanford University.' },
                    { param: 'Communication', weight: 15, score: 9.0, rating: 1.35, evidence: 'Mentored junior engineers and co-authored 3 papers.' }
                ],
                strengths: ['Exceptional academic background (Ph.D.)', 'Extensive PyTorch and CUDA experience', 'Proven track record in MLOps and Kubernetes'],
                ambiguous: ['Specific experience with medical imaging data is not explicitly detailed'],
                weaknesses: ['None identified based on the provided resume'],
                summary: 'Aisha is a top-tier candidate perfectly aligned with the role requirements. She brings deep technical expertise in PyTorch and MLOps, coupled with a strong academic foundation.',
                rationale: 'Candidate exceeds the minimum 4 years of experience and possesses all mandatory technical skills (PyTorch, K8s, AWS). Highly recommended for technical interview.',
                followup: ['Discuss specific scale of previous K8s deployments', 'Evaluate knowledge of medical compliance (HIPAA) in ML pipelines']
            },
            {
                id: 'marcus', name: 'Marcus Johnson', email: 'mjohnson99@email.com', city: 'Austin, TX', file: 'M_Johnson_Resume.pdf', finalScore: 74.0, rec: 'Review further', avatarBg: '#e6f1fb', avatarColor: '#094D7B',
                scores: [
                    { param: 'DL & Modeling Expertise', weight: 35, score: 8.0, rating: 2.8, evidence: 'Strong NLP background, built several LLM orchestrations.' },
                    { param: 'MLOps & Scaling', weight: 25, score: 6.5, rating: 1.62, evidence: 'Familiar with Docker and AWS, but limited Kubernetes experience.' },
                    { param: 'Data Engineering', weight: 15, score: 7.5, rating: 1.12, evidence: 'Good Python data wrangling skills, primarily with Pandas/Spark.' },
                    { param: 'Education', weight: 10, score: 8.0, rating: 0.8, evidence: 'MS in Data Science. Meets requirement.' },
                    { param: 'Communication', weight: 15, score: 7.0, rating: 1.05, evidence: 'Managed offshore data labeling teams.' }
                ],
                strengths: ['Strong NLP model development experience', 'Meets educational requirements (MS)', 'Good baseline cloud knowledge'],
                ambiguous: ['Depth of knowledge in Computer Vision is unclear'],
                weaknesses: ['Lacks hands-on Kubernetes and TensorRT experience', 'Under 4 years of total experience (currently at 3 years)'],
                summary: 'Marcus shows strong potential in NLP and general ML engineering, but lacks the specific high-performance computing (CUDA/TensorRT) and K8s experience requested.',

                followup: ['Probe computer vision fundamentals', 'Assess willingness/ability to ramp up on Kubernetes quickly']
            },
            {
                id: 'elena', name: 'Elena Rodriguez', email: 'erodriguez.dev@email.com', city: 'Seattle, WA', file: 'Elena_ML_Dev.pdf', finalScore: 45.2, rec: 'Rejected', avatarBg: '#FCEBEB', avatarColor: '#A32D2D',
                scores: [
                    { param: 'DL & Modeling Expertise', weight: 35, score: 5.0, rating: 1.75, evidence: 'Mostly traditional ML (scikit-learn). Limited deep learning exposure.' },
                    { param: 'MLOps & Scaling', weight: 25, score: 3.0, rating: 0.75, evidence: 'No production deployment experience listed. Notebook-heavy workflow.' },
                    { param: 'Data Engineering', weight: 15, score: 6.0, rating: 0.9, evidence: 'Basic SQL and Python scripting.' },
                    { param: 'Education', weight: 10, score: 6.0, rating: 0.6, evidence: 'B.S. in Software Engineering. (Master/PhD preferred/required).' },
                    { param: 'Communication', weight: 15, score: 6.0, rating: 0.9, evidence: 'Worked as a solo developer; limited cross-functional evidence.' }
                ],
                strengths: ['Solid traditional machine learning background', 'Proficient in Python and SQL'],
                ambiguous: ['Career goals regarding deep learning vs data analytics'],
                weaknesses: ['Does not meet educational requirement (B.S. only)', 'Lacks deep learning, PyTorch, and CUDA skills', 'No MLOps or cloud deployment experience'],
                summary: 'Elena is a competent data scientist/analyst but does not possess the advanced deep learning and production engineering skills required for this Senior ML role.',
                rationale: 'Candidate profile is aligned with a junior data science role rather than a Senior ML Engineer. Critical technical gaps in PyTorch, MLOps, and deep learning.',
                followup: ['Send standard rejection email', 'Keep on file for future Junior Data Analyst roles']
            }
        ];

        const FILES = [{name: 'Aisha_Patel_CV.pdf'}, {name: 'M_Johnson_Resume.pdf'}, {name: 'Elena_ML_Dev.pdf'}];

        // System State
        let currentStep = 1;

        function showStep(n) {
            currentStep = n;
            document.querySelectorAll('.step-section').forEach((s, i) => {
                s.classList.toggle('hidden', i + 1 !== n);
                s.classList.toggle('flex', i + 1 === n);
            });
            lucide.createIcons();
        }

        // --- CORE ASYNC EXECUTION SEQUENCES ---

        async function executeStep1() {
            showStep(1);
            const rawContainer = document.getElementById('rawText');
            const scrollContainer = document.getElementById('rawScrollContainer');

            // Mobile: start with resolved panel hidden
            if (isMobile()) {
                document.getElementById('resolvedPanel').classList.add('mobile-hidden');
            }

            RAW_JD.forEach((line, i) => {
                const span = document.createElement('span');
                span.className = 'raw-line';
                span.id = `line-${i}`;
                span.textContent = line || '\u00A0';
                rawContainer.appendChild(span);
            });

            await delay(400);

            // Scan Text & Auto Pan Camera (Using background highlight ONLY, no bar)
            for (let i = 0; i < RAW_JD.length; i++) {
                if (i > 0) {
                    const prev = document.getElementById(`line-${i - 1}`);
                    if (prev) prev.classList.remove('scanning');
                }
                const currentLine = document.getElementById(`line-${i}`);
                if (currentLine) {
                    currentLine.classList.add('scanning');
                    // Pan container smoothly to keep scan near vertical center
                    scrollContainer.scrollTop = currentLine.offsetTop - (scrollContainer.clientHeight / 2) + 20;
                }
                await delay(60); 
            }
            
            // Mobile: swap from Raw JD panel to Resolved panel
            if (isMobile()) {
                await delay(300);
                document.getElementById('rawPanel').classList.add('mobile-hidden');
                document.getElementById('resolvedPanel').classList.remove('mobile-hidden');
            }

            // Resolve Attributes
            const list = document.getElementById('resolvedList');
            for (let i = 0; i < RESOLVED_ATTRS.length; i++) {
                await delay(600);
                const attr = RESOLVED_ATTRS[i];
                const div = document.createElement('div');
                div.className = 'resolved-attr bg-white border border-gray-200 rounded-lg overflow-hidden shrink-0 visible';
                div.innerHTML = `
                    <div class="px-2.5 py-1.5 bg-primary-light/50 text-[10px] font-bold text-primary uppercase tracking-wider flex items-center gap-1.5">
                        <i data-lucide="${attr.icon}" class="w-3 h-3"></i> ${attr.key}
                    </div>
                    <div class="px-2.5 py-2 font-mono text-[11px] text-gray-700 leading-relaxed">${attr.content}</div>
                `;
                list.appendChild(div);
                lucide.createIcons();
                list.parentElement.scrollTop = list.parentElement.scrollHeight;
            }

            await delay(400);
            
            await delay(500);
            executeStep2();
        }

        async function executeStep2() {
            showStep(2);
            const tbody = document.getElementById('criteriaBody');
            let totalW = 0;

            for (let i = 0; i < CRITERIA_DATA.length; i++) {
                await delay(350);
                const c = CRITERIA_DATA[i];
                const tr = document.createElement('tr');
                tr.className = 'animate-fade-up bg-white hover:bg-gray-50/50 transition-colors';
                tr.innerHTML = `
                    <td class="py-2.5 px-4 border-b border-gray-100 text-[11.5px] font-semibold text-gray-800">${c.param}</td>
                    <td class="py-2.5 px-4 border-b border-gray-100 text-center"><span class="inline-block bg-primary-light text-primary font-bold text-[11px] px-2 py-0.5 rounded-full">${c.weight}%</span></td>
                    <td class="py-2.5 px-4 border-b border-gray-100 text-[10.5px] text-gray-500 leading-relaxed">${c.note}</td>
                `;
                tbody.appendChild(tr);
                totalW += c.weight;
                document.getElementById('totalWeight').textContent = totalW + '%';
            }

            await delay(800);
            
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerHTML = '<div class="spinner border-t-white border-2"></div> Saving...';

            await delay(800);
            
            saveBtn.classList.add('hidden');

            await delay(500);
            executeStep3();
        }

        async function executeStep3() {
            showStep(3);

            await delay(300);
            const jdSelect = document.getElementById('jdSelect');
            jdSelect.classList.remove('border-gray-200');
            jdSelect.classList.add('border-primary', 'bg-primary-light/30', 'text-primary');
            document.getElementById('jdSelectText').textContent = 'Senior ML Engineer — TechNova AI';

            await delay(400);
            const critSelect = document.getElementById('criteriaSelect');
            critSelect.classList.remove('border-gray-200');
            critSelect.classList.add('border-primary', 'bg-primary-light/30', 'text-primary');
            document.getElementById('criteriaSelectText').textContent = 'Senior ML Engineer — AI Criteria';

            await delay(500);
            const zone = document.getElementById('uploadZone');
            zone.classList.remove('border-gray-200', 'bg-gray-50');
            zone.classList.add('border-primary', 'bg-primary-light/30');
            zone.innerHTML = `
                <i data-lucide="check-circle" class="w-5 h-5 text-primary mb-1.5"></i>
                <div class="text-[11.5px] text-primary font-semibold">3 files dropped</div>
            `;
            lucide.createIcons();

            const list = document.getElementById('fileList');
            for (let i = 0; i < FILES.length; i++) {
                await delay(450);
                const item = document.createElement('div');
                item.className = 'flex items-center gap-2.5 p-2 border border-gray-200 rounded-lg bg-white opacity-0 transform -translate-x-2 transition-all duration-300 shrink-0';
                item.innerHTML = `
                    <i data-lucide="file-text" class="w-3.5 h-3.5 text-gray-400 shrink-0"></i>
                    <span class="text-[11px] font-medium text-gray-700 truncate flex-1">${FILES[i].name}</span>
                    <div class="w-10 h-1 bg-gray-100 rounded-full overflow-hidden shrink-0"><div class="h-full bg-primary w-0 transition-all duration-1000" id="prog-${i}"></div></div>
                `;
                list.appendChild(item);
                lucide.createIcons();
                
                requestAnimationFrame(() => {
                    item.classList.remove('opacity-0', '-translate-x-2');
                    setTimeout(() => {
                        const bar = document.getElementById(`prog-${i}`);
                        if(bar) bar.style.width = '100%';
                    }, 100);
                });
            }

            await delay(1000);
            
            const btn = document.getElementById('provaluateBtn');
            btn.disabled = false;
            btn.classList.remove('opacity-50');
            btn.classList.add('shadow-md');
            
            await delay(600);
            await executeProvaluation();
        }

        async function executeProvaluation() {
            const btn = document.getElementById('provaluateBtn');
            btn.innerHTML = `<div class="spinner"></div> Pro-Valuating... <div class="btn-shimmer running"></div>`;
            btn.classList.remove('bg-primary');
            btn.classList.add('bg-blue-600');
            btn.disabled = true;

            await delay(2000);

            btn.classList.remove('bg-blue-600');
            btn.classList.add('bg-accent');
            btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> Analysis Complete`;
            lucide.createIcons();

            await delay(800);
            await showInlineScorecard(CANDIDATES[0]);
        }

            }

                    <div class="flex items-center gap-3">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="flex flex-col gap-4">

                                            <div class="flex items-center gap-1.5 text-[10px]">

                                            </div>
                                        </div>
                                        <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden mb-1">
                                            <div class="h-full bg-primary rounded-full" style="width:${s.score * 10}%"></div>
                                        </div>
                                        <p class="text-[10px] text-gray-500 leading-relaxed">${s.evidence}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="flex flex-col gap-3">
                            <h4 class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1 border-b border-gray-100 pb-1.5">AI Assessment</h4>
                            <div class="bg-accent-light border-l-4 border-accent p-2.5 rounded-r-lg">
                                <div class="text-[10px] font-bold text-accent uppercase tracking-wide mb-1">Strengths</div>
                                <ul class="text-[11px] text-gray-800 space-y-0.5 list-disc list-inside">
                                    ${c.strengths.map(s => `<li>${s}</li>`).join('')}

                            </div>
                            ${c.ambiguous.length ? `

                if (scrollBody) {
                    const scrollDuration = 3200;
                    const start = performance.now();
                    const tick = (now) => {
                        const progress = Math.min((now - start) / scrollDuration, 1);
                        scrollBody.scrollTop = progress * (scrollBody.scrollHeight - scrollBody.clientHeight);
                        if (progress < 1) requestAnimationFrame(tick);

        // --- AUTOMATED ITERATIVE MODAL DEMO & INSTANT LOOP ---
        async function runModalDemonstration() {
            for (let i = 0; i < CANDIDATES.length; i++) {
                await delay(800);
                openModal(CANDIDATES[i]);
                await delay(3200);
                closeModal(null, true);
            }
            
            // Wait strictly enough time for the modal's close transition to finish
            await delay(300); 
            
            // Instantly start loop
            await resetAndLoopDemo();
        }

        async function resetAndLoopDemo() {
            const app = document.getElementById('app-container');
            
            // Quick 0.2s cross-fade to hide the reset pop
            app.style.opacity = '0';
            await delay(200);
            
            // --- Hard Reset DOM to strictly initial condition ---
            
            // Step 1
            document.getElementById('rawText').innerHTML = '';
            document.getElementById('rawScrollContainer').scrollTop = 0;
            document.getElementById('resolvedList').innerHTML = '';

            // Step 2
            document.getElementById('criteriaBody').innerHTML = '';
            document.getElementById('totalWeight').textContent = '0%';
            
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.classList.remove('hidden');
            saveBtn.className = 'px-4 py-1.5 bg-primary text-white rounded-md font-semibold text-[12px] flex items-center gap-1.5 opacity-50 transition-all';
            saveBtn.innerHTML = '<i data-lucide="save" class="w-3.5 h-3.5"></i> Save Criteria';

            // Step 3
            document.getElementById('fileList').innerHTML = '';
            document.getElementById('candidatePool').innerHTML = '';
            
            // Reset scorecard panel
            document.getElementById('scorecardPanel').classList.add('hidden');
            document.getElementById('scorecardPanel').classList.remove('flex');
            document.getElementById('scorecardPanel').innerHTML = '';
            document.getElementById('poolView').classList.remove('hidden');

            // Reset mobile panel visibility
            if (isMobile()) {
                document.getElementById('rawPanel').classList.remove('mobile-hidden');
                document.getElementById('resolvedPanel').classList.add('mobile-hidden');
                document.getElementById('uploadPanel').classList.remove('mobile-hidden');
            }
            
            document.getElementById('jdSelect').className = 'border border-gray-200 rounded-md p-2 text-[12px] text-gray-400 flex justify-between items-center transition-all bg-white';
            document.getElementById('jdSelectText').textContent = 'Select job description...';
            
            document.getElementById('criteriaSelect').className = 'border border-gray-200 rounded-md p-2 text-[12px] text-gray-400 flex justify-between items-center transition-all bg-white';
            document.getElementById('criteriaSelectText').textContent = 'Select criteria...';
            
            const uploadZone = document.getElementById('uploadZone');
            uploadZone.className = 'border-2 border-dashed border-gray-200 rounded-lg p-4 text-center transition-all bg-gray-50 flex flex-col items-center justify-center mb-3 shrink-0';
            uploadZone.innerHTML = '<i data-lucide="upload-cloud" class="w-6 h-6 text-gray-300 mb-1.5"></i><div class="text-[12px] text-gray-400">Drop CVs here or click</div>';
            
            const proBtn = document.getElementById('provaluateBtn');
            proBtn.className = 'w-full bg-primary text-white py-2.5 rounded-md font-semibold text-[13px] flex items-center justify-center gap-2 relative overflow-hidden transition-all opacity-50 shrink-0';
            proBtn.innerHTML = '<i data-lucide="play-circle" class="w-4 h-4"></i> Pro-Valuate<div class="btn-shimmer" id="btnShimmer"></div>';

            // Reset State variables
            currentStep = 1;

            // Immediately present Step 1 and Re-render Icons
            showStep(1);
            lucide.createIcons();
            
            // Fade App Back In
            app.style.opacity = '1';

            // Immediately restart sequence
            await delay(100);
            executeStep1();
        }

        // --- UI RENDER HELPERS ---

        function getRecStyle(rec) {
            if (rec === 'To Be Interviewed') return { bg: 'bg-accent-light', text: 'text-accent' };
            if (rec === 'Rejected') return { bg: 'bg-danger-light', text: 'text-danger' };
            return { bg: 'bg-warning-light', text: 'text-warning' };
        }

        function addCandidateCard(c, i) {
            const pool = document.getElementById('candidatePool');
            const style = getRecStyle(c.rec);
            const score = Math.round(c.finalScore);
            const initials = c.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

            const card = document.createElement('div');
            card.className = 'candidate-card bg-white border border-gray-200 rounded-xl p-3 cursor-pointer shadow-sm flex flex-col gap-2 shrink-0';

            card.innerHTML = `
                <div class="flex items-start justify-between">
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-[11px] shrink-0" style="background:${c.avatarBg};color:${c.avatarColor}">${initials}</div>

                        </div>

                            <span class="text-[9px] text-gray-400 w-[70px] truncate" title="${s.param}">${s.param}</span>

                    <div>
                        <h3 class="text-[16px] font-bold text-gray-900">${c.name}</h3>
                        <div class="text-[11px] text-gray-500 mt-0.5 flex items-center gap-1.5">
                            <i data-lucide="map-pin" class="w-3 h-3"></i> ${c.city} • <i data-lucide="mail" class="w-3 h-3"></i> ${c.email}
                        </div>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-[24px] font-bold text-primary leading-none">${score}%</div>

            body.innerHTML = `

                            <div class="space-y-3">
                                ${c.scores.map(s => `
                                    <div>
                                        <div class="flex justify-between items-end mb-1">
                                            <span class="text-[11.5px] font-semibold text-gray-800">${s.param}</span>

                    <div class="flex flex-col gap-4">

                                <div class="text-[10px] font-bold text-accent uppercase tracking-wide mb-1">Strengths</div>
                                <ul class="text-[11px] text-gray-800 space-y-0.5 list-disc list-inside">
                                    ${c.strengths.map(s => `<li>${s}</li>`).join('')}
                                </ul>
                            </div>

                            ${c.ambiguous.length ? `
                            <div class="bg-warning-light border-l-4 border-warning p-2.5 rounded-r-lg mb-2">
                                <div class="text-[10px] font-bold text-warning uppercase tracking-wide mb-1">Needs Clarification</div>
                                <ul class="text-[11px] text-gray-800 space-y-0.5 list-disc list-inside">
                                    ${c.ambiguous.map(s => `<li>${s}</li>`).join('')}
                                </ul>
                            </div>` : ''}

                            <div class="bg-danger-light border-l-4 border-danger p-2.5 rounded-r-lg mb-3">
                                <div class="text-[10px] font-bold text-danger uppercase tracking-wide mb-1">Shortcomings</div>
                                <ul class="text-[11px] text-gray-800 space-y-0.5 list-disc list-inside">
                                    ${c.weaknesses.map(s => `<li>${s}</li>`).join('')}
                                </ul>
                            </div>

                            <p class="text-[11.5px] text-gray-700 leading-relaxed bg-gray-50 p-3 rounded-lg border border-gray-100">
                                <strong>Summary:</strong> ${c.summary}
                            </p>
                        </div>

                        <div>
                            <h4 class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-2 border-b border-gray-100 pb-1.5">Follow-up Actions</h4>
                            <div class="space-y-1.5">
                                ${c.followup.map(f => `
                                    <div class="flex items-start gap-1.5 text-[11px] text-gray-700">
                                        <i data-lucide="arrow-right-circle" class="w-3 h-3 text-primary shrink-0 mt-0.5"></i>
                                        <span>${f}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>

            lucide.createIcons();
            overlay.classList.add('open');
        }

        function closeModal(e, force = false) {
            if (force || !e || e.target.id === 'modalOverlay') {
                document.getElementById('modalOverlay').classList.remove('open');
            }
        }

        // Initialize App Loop
        window.addEventListener('load', () => setTimeout(executeStep1, 400));
    </script>
</body>
