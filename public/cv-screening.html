<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CV Screening</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"DM Sans"', 'sans-serif'],
                        mono: ['"DM Mono"', 'monospace'],
                    },
                    colors: {
                        primary: { light: '#e6f1fb', DEFAULT: '#094D7B', dark: '#06385a' },
                        accent:  { light: '#EAF3DE', DEFAULT: '#3B6D11' },
                        warning: { light: '#FAEEDA', DEFAULT: '#BA7517' },
                        danger:  { light: '#FCEBEB', DEFAULT: '#A32D2D' }
                    }
                }
            }
        }
    </script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        body { font-family: 'DM Sans', sans-serif; background: #0D1B2A; }

        /* ── Core Layout ─────────────────────────────────────── */
        #layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

        /* ── Sidebar ─────────────────────────────────────────── */
        #sidebar {
            width: 300px;
            min-width: 260px;
            background: #0D1B2A;
            display: flex;
            flex-direction: column;
            padding: 22px 18px 20px;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }
        /* subtle grid texture */
        #sidebar::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 22px 22px;
            pointer-events: none;
        }

        /* ── Demo Area ───────────────────────────────────────── */
        #demoArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #F0F4F8;
            transition: opacity 0.2s ease;
        }

        /* ── Step Tabs ───────────────────────────────────────── */
        .step-tab {
            display: flex; align-items: flex-start; gap: 11px;
            padding: 10px 11px; border-radius: 10px;
            cursor: pointer; transition: all 0.2s ease;
            border: none; background: transparent; text-align: left; width: 100%;
            position: relative;
        }
        .step-tab:hover { background: rgba(255,255,255,0.04); }
        .step-tab.active { background: rgba(9,77,123,0.22); }
        .step-tab.active::before {
            content: '';
            position: absolute; left: 0; top: 20%; bottom: 20%;
            width: 3px; border-radius: 0 2px 2px 0;
            background: #4A9FD5;
        }
        .step-num {
            width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.18);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.28);
            flex-shrink: 0; margin-top: 1px; transition: all 0.25s ease;
        }
        .step-tab.active .step-num {
            background: #094D7B; border-color: #4A9FD5; color: white;
        }
        .step-label {
            font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,0.3);
            line-height: 1.3; transition: color 0.2s;
        }
        .step-tab.active .step-label { color: white; }
        .step-tagline {
            font-size: 10px; color: rgba(255,255,255,0.2);
            margin-top: 2px; line-height: 1.45; transition: color 0.2s;
        }
        .step-tab.active .step-tagline { color: rgba(255,255,255,0.48); }

        /* ── Benefits ────────────────────────────────────────── */
        .benefit-item {
            display: flex; flex-direction: column;
            padding: 10px 12px; border-radius: 8px;
            background: rgba(255,255,255,0.03);
            animation: fadeUp 0.35s ease both;
        }
        .benefit-item:nth-child(2) { animation-delay: 0.07s; }
        .benefit-item:nth-child(3) { animation-delay: 0.14s; }
        .benefit-icon { color: #5BA9D6; flex-shrink: 0; margin-top: 1px; }
        .benefit-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.82); line-height: 1.35; }
        .benefit-desc  { font-size: 11.5px; color: rgba(255,255,255,0.82); margin-top: 2px; line-height: 1.55; }

        .sidebar-divider { height: 1px; background: rgba(255,255,255,0.07); margin: 14px 0; }

        /* ── Animations ──────────────────────────────────────── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(9px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse-opacity {
            0%, 100% { opacity: 1; } 50% { opacity: 0.35; }
        }
        @keyframes shimmer {
            from { transform: translateX(-100%); } to { transform: translateX(200%); }
        }
        @keyframes spin-slow { to { transform: rotate(360deg); } }
        @keyframes scanPulse {
            0%, 100% { background: rgba(9,77,123,0.10); }
            50%       { background: rgba(9,77,123,0.22); }
        }

        .animate-fade-up { animation: fadeUp 0.4s ease forwards; }
        .pulse-dot { animation: pulse-opacity 1s infinite; }
        .btn-shimmer {
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
            transform: translateX(-100%);
        }
        .btn-shimmer.running { animation: shimmer 1.5s infinite; }
        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin-slow 0.7s linear infinite;
        }

        /* ── Demo Components ─────────────────────────────────── */
        .resolved-attr {
            opacity: 0; transform: translateY(8px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .resolved-attr.visible { opacity: 1; transform: translateY(0); }

        .score-fill { transition: width 1s ease 0.2s; }

        .candidate-card {
            opacity: 0; transform: translateY(10px); transition: all 0.25s ease;
        }
        .candidate-card.visible { opacity: 1; transform: translateY(0); }
        .candidate-card:hover { transform: translateY(-2px); border-color: #094D7B; }

        /* ── Modal ───────────────────────────────────────────── */
        .modal-overlay { opacity: 0; pointer-events: none; transition: opacity 0.25s; }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-content { transform: translateY(16px) scale(0.98); transition: transform 0.3s ease; }
        .modal-overlay.open .modal-content { transform: translateY(0) scale(1); }

        /* ── Scrollbars ──────────────────────────────────────── */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        /* ── Step sections ───────────────────────────────────── */
        .step-section { flex-direction: column; flex: 1; min-height: 0; }


        /* ════════════════════════════════════════════════════════
           MOBILE  (≤767px)
        ════════════════════════════════════════════════════════ */
        @media (max-width: 767px) {
            #layout { flex-direction: column; }

            #sidebar {
                width: 100%; min-width: unset;
                padding: 11px 14px 10px;
                flex-shrink: 0;
            }

            /* Mobile top row: step title only */
            .mobile-top-row {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                padding: 0;
            }

            /* Mobile: step title + benefits below pills */
            #mobileBenefitsRow {
                display: flex; flex-direction: column;
                gap: 3px; margin-top: 0;
            }
            #mobileStepTitle {
                font-size: 12px; font-weight: 700; color: white;
                margin-bottom: 0;
            }
            .mobile-benefit {
                display: flex; align-items: center; gap: 6px;
            }
            .mobile-benefit-icon { color: #5BA9D6; flex-shrink: 0; }
            .mobile-benefit-text { font-size: 10.5px; color: rgba(255,255,255,0.82); font-weight: 700; }

            /* Desktop-only benefit panels hidden on mobile */
            #benefitsDesktop { display: none !important; }
            .sidebar-divider { margin: 7px 0; }

            /* Demo area fills remaining height */
            #demoArea { flex: 1; min-height: 0; overflow: hidden; }

            /* Step 3: hide upload panel on mobile scorecard view */
            .mobile-hidden { display: none !important; }
            
            /* Step 2: Mobile layout with scrollable criteria and fixed bottom */
            #step2TableWrap {
                overflow-y: auto !important;
                overflow-x: hidden !important;
                flex: 1 !important;
            }
            #step2TableWrap table {
                min-width: 100% !important;
                width: 100% !important;
            }
        }

        /* ════════════════════════════════════════════════════════
           DESKTOP (≥768px): hide mobile-specific elements
        ════════════════════════════════════════════════════════ */
        @media (min-width: 768px) {
            .mobile-top-row { display: none; }
            #mobileBenefitsRow { display: none !important; }
            #mobileStepTitle { display: none; }
            .benefit-title { font-size: 19px; }
            .benefit-desc { font-size: 13px; }
        }
    </style>
</head>
<body>

<div id="layout">

    <!-- ═══════════════════════════════════════════════════════════
         SIDEBAR
    ═══════════════════════════════════════════════════════════ -->
    <aside id="sidebar">

        <!-- ── Brand ── -->
        <div class="mobile-top-row">
            <!-- Mobile step title only -->
        </div>

        <!-- Desktop benefits -->
        <div id="benefitsDesktop" style="display:flex;flex-direction:column;gap:8px;flex:1;overflow:hidden">
            <!-- JS-populated -->
        </div>

        <!-- Mobile: step title + compact benefits -->
        <div id="mobileBenefitsRow">
            <div id="mobileStepTitle">Resolve JD</div>
            <div id="mobileBenefitsList" style="display:flex;flex-direction:column;gap:3px">
                <!-- JS-populated -->
            </div>
        </div>

    </aside>


    <!-- ═══════════════════════════════════════════════════════════
         DEMO AREA
    ═══════════════════════════════════════════════════════════ -->
    <main id="demoArea">

        <!-- ═══ STEP 1 : Resolve JD ═══════════════════════════ -->
        <section class="step-section animate-fade-up hidden" id="step1">
            <div class="bg-white flex flex-col flex-1 min-h-0">
                <!-- Header -->
                <div class="px-4 py-2.5 border-b border-gray-100 flex justify-between items-center bg-gray-50/60 shrink-0">
                    <div class="text-[12px] font-semibold text-primary flex items-center gap-2">
                        <i data-lucide="list-checks" class="w-3.5 h-3.5"></i>
                        Resolved Attributes
                    </div>
                    <div class="flex items-center gap-2 text-[11px]" id="scanStatus">
                        <span class="text-primary/70 font-medium">Scanning JD…</span>
                    </div>
                </div>
                <!-- Scan progress bar -->
                <div class="h-0.5 bg-gray-100 shrink-0 overflow-hidden">
                    <div id="scanBar" class="h-full bg-primary" style="width:0"></div>
                </div>
                <!-- Resolved list -->
                <div class="p-4 overflow-y-auto flex-1 bg-gray-50/30">
                    <div class="flex flex-col gap-2.5" id="resolvedList"></div>
                </div>
            </div>
        </section>


        <!-- ═══ STEP 2 : Set Criteria ══════════════════════════ -->
        <section class="step-section animate-fade-up hidden" id="step2">
            <div class="bg-white flex flex-col flex-1 min-h-0 h-full">
                <div class="px-4 py-2.5 border-b border-gray-100 flex justify-between items-center bg-gray-50/60 shrink-0">
                    <div class="text-[12px] font-semibold text-primary flex items-center gap-2">
                        <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
                        Senior ML Engineer — AI Criteria
                    </div>
                    <button class="flex items-center gap-1.5 border border-primary bg-primary-light text-primary px-2.5 py-0.5 rounded-full text-[10.5px] font-medium" id="genBtn">
                        <i data-lucide="sparkles" class="w-3 h-3"></i> Generate from JD
                    </button>
                </div>

                <div id="step2TableWrap" class="flex-1 overflow-y-auto overflow-x-auto flex flex-col bg-white">
                    <table class="w-full text-left border-collapse" style="min-width:420px">
                        <thead class="sticky top-0 bg-primary-light/95 backdrop-blur z-10 border-b border-gray-200">
                            <tr class="text-[10.5px] font-semibold text-primary uppercase tracking-wide">
                                <th class="py-2.5 px-4 w-[34%]">Parameter to Assess</th>
                                <th class="py-2.5 px-4 w-[13%] text-center">Weightage</th>
                                <th class="py-2.5 px-4">How to Assess (Prompt to AI)</th>
                            </tr>
                        </thead>
                        <tbody id="criteriaBody" class="divide-y divide-gray-100"></tbody>
                    </table>
                    <div class="px-4 py-3 border-t border-gray-100 flex justify-end bg-gray-50/50 shrink-0">
                        <span class="text-[11.5px] text-gray-500">Total Weightage: <strong class="text-primary text-[13px]" id="totalWeight">0%</strong></span>
                    </div>
                </div>

                <div class="h-[50px] bg-white border-t border-gray-100 flex items-center justify-end px-4 shrink-0">
                    <button id="saveBtn" class="px-4 py-1.5 bg-primary text-white rounded-md font-semibold text-[12px] flex items-center gap-1.5 opacity-50 transition-all" disabled>
                        <i data-lucide="save" class="w-3.5 h-3.5"></i> Save Criteria
                    </button>
                </div>
            </div>
        </section>


        <!-- ═══ STEP 3 : Assess CVs ════════════════════════════ -->
        <section class="step-section animate-fade-up hidden" id="step3">
            <div class="grid grid-cols-12 gap-0 flex-1 min-h-0 h-full" id="step3Grid" style="display:grid">

                <!-- Left: Upload Panel -->
                <div id="uploadPanel" class="col-span-12 md:col-span-4 flex flex-col border-r border-gray-200 bg-white">
                    <div class="p-4 shrink-0 border-b border-gray-100">
                        <h3 class="text-[12px] font-semibold text-primary mb-3">Session Setup</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="text-[10px] font-medium text-gray-400 block mb-1">Job Description</label>
                                <div class="border border-gray-200 rounded-md p-2 text-[12px] text-gray-400 flex justify-between items-center bg-white" id="jdSelect">
                                    <span id="jdSelectText" class="truncate">Select job description…</span>
                                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 opacity-40 shrink-0"></i>
                                </div>
                            </div>
                            <div>
                                <label class="text-[10px] font-medium text-gray-400 block mb-1">Scoring Criteria</label>
                                <div class="border border-gray-200 rounded-md p-2 text-[12px] text-gray-400 flex justify-between items-center bg-white" id="criteriaSelect">
                                    <span id="criteriaSelectText" class="truncate">Select criteria…</span>
                                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 opacity-40 shrink-0"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col flex-1 min-h-0">
                        <div class="px-4 py-2.5 border-b border-gray-100 flex justify-between items-center shrink-0 bg-gray-50/50">
                            <h3 class="text-[12px] font-semibold text-primary">Upload CVs</h3>
                        </div>
                        <div class="p-4 flex-1 flex flex-col min-h-0">
                            <div class="border-2 border-dashed border-gray-200 rounded-lg p-4 text-center bg-gray-50 flex flex-col items-center justify-center mb-3 shrink-0" id="uploadZone">
                                <i data-lucide="upload-cloud" class="w-6 h-6 text-gray-300 mb-1.5"></i>
                                <div class="text-[12px] text-gray-400">Drop CVs here or click</div>
                            </div>
                            <div class="flex flex-col gap-1.5 mb-4 min-h-[70px] md:flex-1 overflow-y-auto pr-1" id="fileList"></div>
                            <button class="w-full bg-primary text-white py-2.5 rounded-md font-semibold text-[13px] flex items-center justify-center gap-2 relative overflow-hidden transition-all opacity-50 shrink-0" id="provaluateBtn" disabled>
                                <i data-lucide="play-circle" class="w-4 h-4"></i> Analyze
                                <div class="btn-shimmer" id="btnShimmer"></div>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Right: Candidate Pool + Scorecard -->
                <div id="step3RightPanel" class="col-span-12 md:col-span-8 bg-gray-50/30 flex flex-col min-h-0 relative h-full">
                    <div id="poolView" class="flex flex-col flex-1 min-h-0 p-4 md:p-5">
                        <div class="flex-1 overflow-y-auto pr-2 grid grid-cols-2 gap-3 pb-2 content-start mt-2" id="candidatePool"></div>
                    </div>
                    <div id="scorecardPanel" class="hidden flex-col flex-1 md:h-full overflow-hidden animate-fade-up"></div>
                </div>
            </div>
        </section>

    </main>
</div>


<!-- ═══════════════════════════════════════════════════════════════
     MODAL
═══════════════════════════════════════════════════════════════ -->
<div class="modal-overlay fixed inset-0 bg-slate-900/50 z-[100] flex items-center justify-center p-4 md:p-6 backdrop-blur-sm" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-content bg-white w-full max-w-5xl rounded-2xl shadow-2xl flex flex-col overflow-hidden" style="max-height:85vh" id="modal">
        <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-start shrink-0 bg-gray-50/80" id="modalHeader"></div>
        <div class="p-5 overflow-y-auto flex-1 bg-white" id="modalBody"></div>
    </div>
</div>


<!-- ═══════════════════════════════════════════════════════════════
     SCRIPT
═══════════════════════════════════════════════════════════════ -->
<script>
    const delay  = ms => new Promise(res => setTimeout(res, ms));
    const isMobile = () => window.innerWidth < 768;

    lucide.createIcons();

    /* ── Benefits Content ──────────────────────────────────── */
    const STEP_META = {
        1: {
            name: 'Resolve JD',
            benefits: [
                { icon: 'file-search',  title: 'Consistency', desc: 'Every assessor, human or AI, works from the exact same structured benchmark — no subjective interpretation.', mobileDesc: 'One benchmark. Every assessor. No drift.' },
                { icon: 'layers',       title: 'Clarity', desc: 'Mandatory and preferred requirements are explicitly separated, so candidates are never penalised for missing a wish-list item.', mobileDesc: 'Mandatory vs. nice-to-have, explicitly separated.' },
                { icon: 'equal',        title: 'Reliability', desc: 'A saved, resolved JD anchors every assessment to a fixed context, eliminating the drift that plagues generic AI tools.', mobileDesc: 'Fixed context. No AI hallucination.' },
                { icon: 'zap',          title: 'Efficiency', desc: 'Resolve once, assess hundreds — every CV evaluated against the same structured JD with no re-processing or extra cost.', mobileDesc: 'Resolve once. Assess hundreds.' },
                { icon: 'shield-check', title: 'Auditability', desc: 'A documented record of exactly what the role required at assessment time, critical for compliance and audit trails.', mobileDesc: 'A documented record for every hiring decision.' }
            ]
        },
        2: {
            name: 'Set Criteria',
            benefits: [
                { icon: 'target',       title: 'Precision', desc: 'Define the exact parameters — technical depth, domain experience, leadership — that determine success in this specific role.', mobileDesc: 'Define exactly what good looks like for this role.' },
                { icon: 'sliders',      title: 'Business alignment', desc: 'Weighted criteria ensure the final score mirrors your actual hiring priorities, not an arbitrary average.', mobileDesc: 'Scores reflect your priorities, not averages.' },
                { icon: 'sparkles',     title: 'Speed', desc: 'ProValuate analyses your resolved JD and auto-suggests a criteria framework with parameters and weightages, ready to edit and save.', mobileDesc: 'AI suggests your criteria framework instantly.' },
                { icon: 'save',         title: 'Reusability', desc: 'Save criteria sets by role type and reuse them across every hiring cycle — built once, applied every time.', mobileDesc: 'Built once, applied every hiring cycle.' },
                { icon: 'scale',        title: 'Fairness', desc: 'Every candidate scored against the same explicit criteria makes decisions explainable and bias structurally reduced.', mobileDesc: 'Same criteria, every candidate. Bias removed by design.' }
            ]
        },
        3: {
            name: 'Assess CVs',
            benefits: [
                { icon: 'file-check',   title: 'Depth', desc: 'Every score is backed by specific CV evidence, so recruiters see exactly why a candidate rated 7.5 on technical skills — no black-box numbers.', mobileDesc: 'Every score has evidence behind it. No black boxes.' },
                { icon: 'users',        title: 'Scale', desc: 'ProValuate applies the same rigour to the hundredth CV as the first, eliminating the fatigue and drift of manual screening at volume.', mobileDesc: 'Same rigour on CV 100 as CV 1.' },
                { icon: 'arrow-right',  title: 'Actionability', desc: 'Every assessment concludes with a clear Interview / Review / Reject recommendation, supported by rationale and specific follow-up actions.', mobileDesc: 'Interview / Review / Reject. Clear next step, always.' },
                { icon: 'repeat',       title: 'Repeatability', desc: 'With a fixed JD and saved criteria, the same candidate assessed twice always receives the same score.', mobileDesc: 'Same candidate, same score. Every time.' },
                { icon: 'brain',        title: 'Insight', desc: 'Each assessment surfaces strengths, ambiguous areas, and explicit weaknesses — giving interviewers a focused agenda before the first conversation.', mobileDesc: 'Strengths, gaps, and risks surfaced before the first call.' }
            ]
        }
    };

    /* ── App Data ──────────────────────────────────────────── */
    const RESOLVED_ATTRS = [
        { key: 'Role Details',              icon: 'briefcase',      content: `<span class="inline-block bg-white border border-gray-200 px-2 py-0.5 rounded text-[10px] text-gray-700 mr-1 mb-1 shadow-sm">Senior Machine Learning Engineer</span><span class="inline-block bg-white border border-gray-200 px-2 py-0.5 rounded text-[10px] text-gray-700 mr-1 mb-1 shadow-sm">Full time</span>` },
        { key: 'Location',                  icon: 'map-pin',        content: `<span class="inline-block bg-white border border-gray-200 px-2 py-0.5 rounded text-[10px] text-gray-700 mr-1 mb-1 shadow-sm">San Francisco, CA (Hybrid)</span>` },
        { key: 'Job History',               icon: 'clock',          content: `<span class="inline-block bg-white border border-gray-200 px-2 py-0.5 rounded text-[10px] text-gray-700 mr-1 mb-1 shadow-sm">4+ years experience in applied ML and MLOps</span>` },
        { key: 'Technical Skills',          icon: 'code',           content: ['Python','PyTorch','CUDA','TensorRT','ONNX','AWS/GCP','Docker','Kubernetes'].map(s=>`<span class="inline-block bg-primary-light border border-primary/20 text-primary px-2 py-0.5 rounded text-[10px] mr-1 mb-1">${s}</span>`).join('') },
        { key: 'Functional Skills',         icon: 'wrench',         content: ['Model Development','Data Pipeline Architecture','Production Scaling','Drift Detection','NLP','Computer Vision'].map(s=>`<span class="inline-block bg-accent-light border border-accent/20 text-accent px-2 py-0.5 rounded text-[10px] mr-1 mb-1">${s}</span>`).join('') },
        { key: 'Soft Skills',               icon: 'brain',          content: ['Cross-functional Collaboration','Excellent communication','Explain complex ML'].map(s=>`<span class="inline-block bg-white border border-gray-200 text-gray-700 px-2 py-0.5 rounded text-[10px] mr-1 mb-1 shadow-sm">${s}</span>`).join('') },
        { key: 'Educational Qualification', icon: 'graduation-cap', content: `<span class="inline-block bg-accent-light border border-accent/20 text-accent px-2 py-0.5 rounded text-[10px] mr-1 mb-1">Master's or Ph.D. in Computer Science or AI</span>` }
    ];

    const CRITERIA_DATA = [

        return                                   { bg:'bg-warning-light',  text:'text-warning'  };

        const style    = getRecStyle(c.rec);
        const score    = Math.round(c.finalScore);
        const initials = c.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

        header.innerHTML = `
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-[14px]" style="background:${c.avatarBg};color:${c.avatarColor}">${initials}</div>
                <div>
                    <h3 class="text-[16px] font-bold text-gray-900">${c.name}</h3>
                    <div class="text-[11px] text-gray-500 mt-0.5 flex items-center gap-1.5">
                        <i data-lucide="map-pin" class="w-3 h-3"></i> ${c.city} &bull;
                        <i data-lucide="mail" class="w-3 h-3"></i> ${c.email}
                    </div>
                </div>
            </div>
            <div class="text-right">
                <div class="text-[24px] font-bold text-primary leading-none">${score}%</div>
                <div class="${style.bg} ${style.text} px-2.5 py-0.5 rounded-full text-[10px] font-bold mt-1.5 inline-block">${c.rec}</div>
            </div>
        `;

        body.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="flex flex-col gap-4">
                    <div>
                        <h4 class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-3 border-b border-gray-100 pb-1.5">Criteria Scoring</h4>
                        <div class="space-y-3">
                            ${c.scores.map(s=>`
                                <div>
                                    <div class="flex justify-between items-end mb-1">
                                        <span class="text-[11.5px] font-semibold text-gray-800">${s.param}</span>
                                        <div class="flex items-center gap-1.5 text-[10px]">
                                            <span class="text-gray-400">W: ${s.weight}%</span>
                                            <span class="font-bold text-primary">${s.score.toFixed(1)}/10</span>
                                        </div>
                                    </div>
                                    <div class="h-1 bg-gray-100 rounded-full overflow-hidden mb-1"><div class="h-full bg-primary" style="width:${s.score*10}%"></div></div>
                                    <p class="text-[10px] text-gray-500 leading-relaxed">${s.evidence}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
                <div class="flex flex-col gap-4">
                    <div>
                        <h4 class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-3 border-b border-gray-100 pb-1.5">AI Assessment</h4>
                        <div class="bg-accent-light border-l-4 border-accent p-2.5 rounded-r-lg mb-2">
                            <div class="text-[10px] font-bold text-accent uppercase tracking-wide mb-1">Strengths</div>
                            <ul class="text-[11px] text-gray-800 space-y-0.5 list-disc list-inside">${c.strengths.map(s=>`<li>${s}</li>`).join('')}</ul>
                        </div>
                        ${c.ambiguous.length ? `
                        <div class="bg-warning-light border-l-4 border-warning p-2.5 rounded-r-lg mb-2">
                            <div class="text-[10px] font-bold text-warning uppercase tracking-wide mb-1">Needs Clarification</div>
                            <ul class="text-[11px] text-gray-800 space-y-0.5 list-disc list-inside">${c.ambiguous.map(s=>`<li>${s}</li>`).join('')}</ul>
                        </div>` : ''}
                        <div class="bg-danger-light border-l-4 border-danger p-2.5 rounded-r-lg mb-3">
                            <div class="text-[10px] font-bold text-danger uppercase tracking-wide mb-1">Shortcomings</div>
                            <ul class="text-[11px] text-gray-800 space-y-0.5 list-disc list-inside">${c.weaknesses.map(s=>`<li>${s}</li>`).join('')}</ul>
                        </div>
                        <p class="text-[11.5px] text-gray-700 leading-relaxed bg-gray-50 p-3 rounded-lg border border-gray-100"><strong>Summary:</strong> ${c.summary}</p>
                    </div>
                    <div>
                        <h4 class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-2 border-b border-gray-100 pb-1.5">Follow-up Actions</h4>
                        <div class="space-y-1.5">
                            ${c.followup.map(f=>`
                                <div class="flex items-start gap-1.5 text-[11px] text-gray-700">
                                    <i data-lucide="arrow-right-circle" class="w-3 h-3 text-primary shrink-0 mt-0.5"></i>
                                    <span>${f}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            </div>
        `;

        lucide.createIcons();
        overlay.classList.add('open');
    }

    function closeModal(e, force = false) {
        if (force || !e || e.target.id === 'modalOverlay') {
            document.getElementById('modalOverlay').classList.remove('open');
        }
    }

    /* ── Init ──────────────────────────────────────────────── */
    window.addEventListener('load', () => {
        updateSidebar(1);
        setTimeout(executeStep1, 400);
    });
</script>
</body>
</html>
